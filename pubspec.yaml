name: chatview
description: A Flutter package that allows you to integrate Chat View with highly customization options.
version: 3.1.0
issue_tracker: https://github.com/SimformSolutionsPvtLtd/chatview/issues
repository: https://github.com/SimformSolutionsPvtLtd/chatview

platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  any_link_preview: 3.0.3
  audio_waveforms: 2.0.2
  cached_network_image: 3.4.1
  chatview_utils: ^3.2.0

  emoji_picker_flutter: 4.4.0
  flutter:
    sdk: flutter
  image_picker: 1.2.2
  intl: 0.20.2
  url_launcher: 6.3.2

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

# Build against the local chatview_utils (3.2.0) until it is published.
# Remove once chatview_utils 3.2.0 is available on pub.dev.
dependency_overrides:
  chatview_utils:
    path: ../chatview_models

flutter:
  config:
    enable-swift-package-manager: false
